name: Build and push API image

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push :latest"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - master
  pull_request:

env:
  IMAGE_NAME: mirror-ai-agent

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LLM_MODE: stub
      LLM_PLANNER_MODE: rule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-bootstrap.lock
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Offline regression suite
        run: .venv/bin/python -m pytest tests -m 'not llm_live' -q
      - name: Dependency vulnerability checks
        run: |
          .venv/bin/python -m pip install pip-audit==2.10.1
          .venv/bin/python -m pip_audit --require-hashes -r requirements.lock
          .venv/bin/python -m pip_audit --require-hashes -r requirements-bootstrap.lock
          .venv/bin/python scripts/audit_frontend.py

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        shell: bash
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$REGISTRY_HOST$REGISTRY_NAMESPACE$REGISTRY_USERNAME$REGISTRY_PASSWORD" ]]; then
            echo '::notice::No registry configured; validating the image without publishing.'
            image="${IMAGE_NAME}"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            : "${REGISTRY_HOST:?Missing REGISTRY_HOST}"
            : "${REGISTRY_NAMESPACE:?Missing REGISTRY_NAMESPACE}"
            : "${REGISTRY_USERNAME:?Missing REGISTRY_USERNAME}"
            : "${REGISTRY_PASSWORD:?Missing REGISTRY_PASSWORD}"
            image="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/${IMAGE_NAME}"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:${short_sha}"
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.push_latest || 'true' }}" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:${short_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run regressions inside release image
        env:
          IMAGE: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true \
            -e LLM_MODE=stub -e LLM_PLANNER_MODE=rule \
            -v "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            -v "$GITHUB_WORKSPACE/web/app.html:/app/web/app.html:ro" \
            "$IMAGE" python -m pytest tests -m 'not llm_live' -q

      - name: Scan all image vulnerabilities before publication
        env:
          IMAGE: ${{ steps.meta.outputs.sha_tag }}
          TRIVY: aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          # The online downloader cannot access the image, source or Docker socket.
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY" image --download-db-only
          docker image save "$IMAGE" -o "$RUNNER_TEMP/release-image.tar"
          # Scan the exact candidate offline, with no ignores or severity filters.
          docker run --rm --network none \
            -v "$RUNNER_TEMP/release-image.tar:/scan/image.tar:ro" \
            -v "$RUNNER_TEMP/trivy-cache/db:/root/.cache/trivy/db:ro" \
            "$TRIVY" image --input /scan/image.tar --skip-db-update --offline-scan \
            --skip-check-update --scanners vuln --exit-code 1 --format json \
            > "$RUNNER_TEMP/image-vulnerabilities.json"

      - name: Retain image scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-vulnerabilities
          path: ${{ runner.temp }}/image-vulnerabilities.json
          if-no-files-found: ignore

      - name: Publish verified image
        if: steps.meta.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
